name: SSEP Pipeline Monitor

on:
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit state.json back
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SSEP_SMTP_HOST: ${{ secrets.SSEP_SMTP_HOST }}
          SSEP_SMTP_PORT: ${{ secrets.SSEP_SMTP_PORT }}
          SSEP_SMTP_USER: ${{ secrets.SSEP_SMTP_USER }}
          SSEP_SMTP_PASS: ${{ secrets.SSEP_SMTP_PASS }}
          SSEP_EMAIL_TO: ${{ secrets.SSEP_EMAIL_TO }}
          SSEP_COURTLISTENER_TOKEN: ${{ secrets.SSEP_COURTLISTENER_TOKEN }}
          SSEP_LEGISCAN_API_KEY: ${{ secrets.SSEP_LEGISCAN_API_KEY }}
          SSEP_BLUESKY_HANDLE: ${{ secrets.SSEP_BLUESKY_HANDLE }}
          SSEP_BLUESKY_APP_PASSWORD: ${{ secrets.SSEP_BLUESKY_APP_PASSWORD }}
        run: python pipeline_monitor.py --once

      - name: Commit updated state
        run: |
          git config user.name "ssep-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update monitor state [skip ci]"
          git push
